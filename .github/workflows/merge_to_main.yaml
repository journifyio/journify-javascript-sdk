name: Merge to main

on:
  pull_request:
    branches:
      - main
    types: [closed]

env:
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Get GitHub App user ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install modules
        run: yarn install


      - name: Configure git
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Bump version and tag
        id: release_check
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          echo "new_release=false" >> $GITHUB_OUTPUT

          if echo "$PR_LABELS" | grep -q '"no-release"'; then
            echo "PR labeled no-release, skipping version bump and release"
            exit 0
          fi

          bump="patch"
          if echo "$PR_LABELS" | grep -q '"major"'; then
            bump="major"
          elif echo "$PR_LABELS" | grep -q '"minor"'; then
            bump="minor"
          fi

          npm run ${bump}-version

          current_version=$(node -p "require('./package.json').version")
          tag_name="v$current_version"

          git commit -am "update version ($bump)"
          git tag -a "$tag_name" -m "New version $tag_name"
          git push --atomic origin HEAD:main "refs/tags/$tag_name"

          echo "new_release=true" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "current_version=$current_version" >> $GITHUB_OUTPUT

      - name: Slack notification - Publishing
        if: steps.release_check.outputs.new_release == 'true'
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "*JavaScript SDK*: Publishing version *${{ steps.release_check.outputs.tag_name }}* to *stage* ..."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Build stable version
        id: build_stable
        if: steps.release_check.outputs.new_release == 'true'
        run: npm run build


      - name: Prepare npm prerelease version
        id: npm_prerelease
        if: steps.release_check.outputs.new_release == 'true'
        run: |
          base_version=$(node -p "require('./package.json').version")
          prerelease_version="${base_version}-beta.${GITHUB_RUN_NUMBER}"

          npm version --no-git-tag-version "$prerelease_version"
          npm run update-version

          echo "prerelease_version=$prerelease_version" >> $GITHUB_OUTPUT

      - name: Publish prerelease to npm (beta tag)
        id: npm_publish_beta
        if: steps.release_check.outputs.new_release == 'true'
        run: npm publish --tag beta --access public --provenance

      - name: Slack notification - Publishing beta
        if: steps.npm_publish_beta.outcome == 'success'
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "*JavaScript SDK*: Published beta version *${{ steps.npm_prerelease.outputs.prerelease_version }}* to *npm* :white_check_mark:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack notification - Failed Publishing beta
        if: steps.npm_publish_beta.outcome == 'failure'
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "*JavaScript SDK*: Failed to publish beta version *${{ steps.npm_prerelease.outputs.prerelease_version }}* to *npm* :x:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - id: auth
        name: Login to GCloud
        if: steps.release_check.outputs.new_release == 'true'
        uses: google-github-actions/auth@v2
        with:
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          
      - id: publish_latest_to_staging_cdn
        name: Publish latest to staging CDN
        if: steps.release_check.outputs.new_release == 'true'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          path: 'dist/_bundles/journifyio.min.js'
          destination: 'static.journify.dev/@journifyio/js-sdk@latest'
          headers: |-
            content-type: 'text/javascript; charset=utf-8'

      - id: publish_current_version_to_staging_cdn
        name: Publish current version to staging CDN
        if: steps.release_check.outputs.new_release == 'true'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          path: 'dist/_bundles/journifyio.min.js'
          destination: "static.journify.dev/@journifyio/js-sdk@${{ steps.release_check.outputs.current_version }}"
          headers: |-
            content-type: 'text/javascript; charset=utf-8'

      - name: Slack notification - Published
        if: steps.release_check.outputs.new_release == 'true' && steps.publish_latest_to_staging_cdn.outcome == 'success' && steps.publish_current_version_to_staging_cdn.outcome == 'success'
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "*JavaScript SDK*: :rocket: Published version *${{ steps.release_check.outputs.tag_name }}* to *CDN* :white_check_mark:!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      
      - name: Slack notification - Publishing failed
        uses: slackapi/slack-github-action@v1.23.0
        if: steps.release_check.outputs.new_release == 'true' && (steps.publish_latest_to_staging_cdn.outcome == 'failure' || steps.publish_current_version_to_staging_cdn.outcome == 'failure')
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "<!here> *JavaScript SDK*: :x: Publishing of version *${{ steps.release_check.outputs.tag_name }}* to *CDN* failed :cry:!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Release to Github
        if: steps.release_check.outputs.new_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.release_check.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Set up Cloud SDK'
        if: steps.release_check.outputs.new_release == 'true'
        uses: 'google-github-actions/setup-gcloud@v2'
            
              
      - name: Purge GCP CDN cache
        id: purge_cdn_cache
        if: steps.release_check.outputs.new_release == 'true'  
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ secrets.GLB_STAGING }} \
            --path "/@journifyio/js-sdk@latest/journifyio.min.js" \
            --async

      - name: Slack notification - Publishing failed
        uses: slackapi/slack-github-action@v1.23.0
        if: steps.release_check.outputs.new_release == 'true' && steps.purge_cdn_cache.outcome == 'failure'
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "<!here> *JavaScript SDK*: :x: Purging of version *${{ steps.release_check.outputs.tag_name }}* from *CDN* failed :cry:!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}


      - name: Prepare npm prerelease version
        id: npm_prerelease
        if: steps.release_check.outputs.new_release == 'true'
        run: |
          base_version=$(node -p "require('./package.json').version")
          prerelease_version="${base_version}-beta.${GITHUB_RUN_NUMBER}"

          npm version --no-git-tag-version "$prerelease_version"
          npm run update-version

          echo "prerelease_version=$prerelease_version" >> $GITHUB_OUTPUT

      - name: Build prerelease version
        id: build_prerelease
        if: steps.release_check.outputs.new_release == 'true'
        run: npm run build

      - name: Publish prerelease to npm (beta tag)
        id: npm_publish_beta
        if: steps.release_check.outputs.new_release == 'true'
        run: npm publish --tag beta --access public --provenance

      - name: Slack notification - Publishing beta
        if: steps.npm_publish_beta.outcome == 'success'
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "*JavaScript SDK*: :rocket: Published version *${{ steps.release_check.outputs.tag_name }}* to *stage* :tada:!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack notification - Publishing failed
        uses: slackapi/slack-github-action@v1.23.0
        if: steps.release_check.outputs.new_release == 'true' && failure()
        with:
          channel-id: ${{secrets.SLACK_CHANNEL_ID}}
          payload: |
            {
              "text": "<!here> *JavaScript SDK*: :x: Publishing of version *${{ steps.release_check.outputs.tag_name }}* to *stage* failed :cry:!"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
